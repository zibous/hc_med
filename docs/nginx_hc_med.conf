# KPI-Endpoint ohne Auth (für dbo Dashboard)
location = /dashboardhcmed/api/kpidata {
    auth_basic off;
    proxy_pass http://10.1.1.119:8065/api/kpidata;
}

location ^~ /dashboardhcmed/ {
    # LAN ohne Auth, extern mit Basic Auth
    # echo "peter:$(openssl passwd -apr1 'dein-passwort')" | sudo tee nginx/includes/.htpasswd_hcmed
    satisfy any;
    allow 10.1.1.0/24;
    deny all;
    auth_basic "Laborwerte Dashboard";
    auth_basic_user_file /etc/nginx/includes/.htpasswd_hcmed;

    access_log off;
    log_not_found off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_pass http://10.1.1.119:8065/;
}
