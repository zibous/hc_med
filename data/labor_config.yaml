# Labor Dashboard Konfiguration
# Beschreibungen, Gruppen, Farben und Icons

patient:
  vorname: "Hans-Peter"
  nachname: "Siebler"
  geburtsdatum: "1955-12-16"
  geschlecht: "m"

gruppen:
  Blutbild:
    icon: "🩸"
    farbe: "#ef4444"
    beschreibung: >
      Zeigt ob genug rote/weiße Blutkörperchen und Blutplättchen vorhanden sind –
      wichtig für Sauerstofftransport und Immunabwehr.
  Differentialblutbild:
    icon: "🔬"
    farbe: "#f97316"
    beschreibung: >
      Aufschlüsselung der weißen Blutzellen – zeigt welcher Teil des Immunsystems
      gerade aktiv ist.
  Entzündung:
    icon: "🔥"
    farbe: "#f59e0b"
    beschreibung: >
      Entzündung ist die Abwehrreaktion des Körpers auf schädigende Reize.
      Hohe Werte deuten auf Infektionen oder Gewebeschäden hin.
  Leber:
    icon: "🫁"
    farbe: "#84cc16"
    beschreibung: >
      Die Leber entgiftet das Blut und produziert wichtige Eiweiße.
      Erhöhte Werte können auf Leberschäden oder Gallenstau hinweisen.
  Niere:
    icon: "💧"
    farbe: "#06b6d4"
    beschreibung: >
      Die Nieren filtern Abfallstoffe aus dem Blut. Die GFR zeigt wie gut sie
      arbeiten – sinkt natürlich im Alter leicht ab.
  Elektrolyte:
    icon: "⚡"
    farbe: "#8b5cf6"
    beschreibung: >
      Mineralstoffe die für Nerven, Muskeln und Wasserhaushalt essenziell sind.
      Müssen in engem Bereich bleiben.
  Stoffwechsel:
    icon: "🧬"
    farbe: "#ec4899"
    beschreibung: >
      Blutzucker und Langzeitwert HbA1c – zeigen wie gut der Körper Zucker
      verarbeitet. Wichtig für Diabetes-Früherkennung.
  Lipide:
    icon: "🫀"
    farbe: "#f43f5e"
    beschreibung: >
      Blutfette wie Cholesterin und Triglyceride. Zu hohe Werte erhöhen langfristig
      das Risiko für Herzinfarkt und Schlaganfall.
  Pankreas:
    icon: "🟡"
    farbe: "#eab308"
    beschreibung: >
      Enzyme der Bauchspeicheldrüse. Erhöhte Werte können auf eine Entzündung
      oder Gallenstein hindeuten.
  Gerinnung:
    icon: "🩹"
    farbe: "#14b8a6"
    beschreibung: >
      Zeigt wie schnell das Blut gerinnt. Wichtig bei Blutverdünner-Therapie
      und vor Operationen.
  Harnanalyse:
    icon: "🧪"
    farbe: "#6366f1"
    beschreibung: >
      Urin-Untersuchung – kann Hinweise auf Nieren-, Blasen- oder
      Stoffwechselprobleme geben, ohne Blutabnahme.
  Schilddrüse:
    icon: "🦋"
    farbe: "#0ea5e9"
    beschreibung: >
      TSH steuert die Schilddrüse. Zu hoch = Unterfunktion (müde, kalt),
      zu niedrig = Überfunktion (unruhig, schneller Puls).
  Tumor-Marker:
    icon: "🎯"
    farbe: "#a855f7"
    beschreibung: >
      PSA ist ein Screening-Wert für die Prostata. Ein Anstieg muss nicht Krebs
      bedeuten, sollte aber beobachtet werden.
  Autoimmun:
    icon: "🛡️"
    farbe: "#10b981"
    beschreibung: >
      Antikörper die zeigen ob das Immunsystem fälschlicherweise eigenes Gewebe
      angreift (z.B. bei Rheuma).
  Hormone:
    icon: "💉"
    farbe: "#d946ef"
    beschreibung: >
      Botenstoffe die Stoffwechsel, Wachstum und Fortpflanzung steuern.
  Körperdaten:
    icon: "📏"
    farbe: "#64748b"
    beschreibung: >
      Gewicht, BMI, Muskelmasse und Fettanteil – die Basis für die Interpretation
      vieler Laborwerte.
  Sonstige:
    icon: "📋"
    farbe: "#78716c"
    beschreibung: >
      Weitere Laborwerte die keiner Hauptgruppe zugeordnet sind.

tests:
  # Blutbild
  Leukozyten: "Weiße Blutkörperchen – das Immunsystem. Erhöht bei Infekten, Stress oder nach OPs. Bei Männern 60+ kann die Norm leicht höher sein (bis 10.5)."
  Erythrozyten: "Rote Blutkörperchen – transportieren Sauerstoff. Männer haben natürlich höhere Werte als Frauen (4.5–5.9 vs. 4.0–5.2). Sinkt leicht im Alter."
  Hämoglobin: "Roter Blutfarbstoff. Männer-Norm: 13.0–17.5 g/dL. Bei Männern 70+ kann 12.5 noch akzeptabel sein. Niedrig = Blutarmut, Müdigkeit."
  Hämatokrit: "Anteil fester Bestandteile im Blut. Männer: 41–53%, steigt bei Dehydrierung. Im Alter tendenziell etwas niedriger."
  MCV: "Größe der roten Blutkörperchen. Alters- und geschlechtsunabhängig. Hilft die Art einer Blutarmut zu bestimmen."
  MCH: "Hämoglobin pro rotem Blutkörperchen. Altersunabhängig – zeigt wie gut die Zellen beladen sind."
  MCHC: "Konzentration des Hämoglobins in den roten Blutkörperchen. Stabil über Alter und Geschlecht."
  RDW: "Größenverteilung der roten Blutkörperchen. Erhöht bei Eisenmangel oder Vitaminmangel (B12/Folsäure)."
  Thrombozyten: "Blutplättchen – wichtig für die Gerinnung. Geschlechts-/altersunabhängig. Unter 100: Blutungsrisiko prüfen."
  MPV: "Durchschnittliche Größe der Blutplättchen. Jung und aktiv = größer. Altersunabhängig."
  # Entzündung
  CRP: "C-reaktives Protein – schneller Entzündungsmarker. Bei Männern 60+ kann Basiswert durch Übergewicht/Alter leicht erhöht sein (bis 0.5 noch normal)."
  Interleukin-6: "Botenstoff der Entzündung – reagiert innerhalb Stunden. Steigt im Alter leicht an (Inflammaging)."
  Procalcitonin: "Erhöht bei bakteriellen Infekten. Alters-/geschlechtsunabhängig. Normal bei Virusinfekten."
  BSG 1h: "Blutsenkung – bei Männern 60+: Norm bis 20mm/h (steigt mit dem Alter). Unspezifisch aber zuverlässig."
  # Leber
  GOT: "Leberenzym (AST). Männer-Norm: <50 U/L. Erhöht bei Leberschäden, intensivem Sport oder Herzinfarkt."
  GPT: "Leberenzym (ALT). Männer-Norm: <50 U/L. Spezifischer für Leberzellschäden als GOT. Sinkt leicht im Alter."
  GGT: "Gamma-GT. Männer-Norm: <60 U/L (Frauen <40). Empfindlichster Marker für Leber/Galle und Alkohol."
  Alk. Phosphatase: "Alkalische Phosphatase. Bei Männern 60+: 40–129 U/L. Erhöht bei Gallenstau oder Knochenprozessen."
  Bilirubin: "Abbauprodukt des Hämoglobins. Geschlechtsunabhängig. Leicht erhöht (Gilbert-Syndrom) ist harmlos."
  LDH: "Unspezifisches Enzym. Alters-/geschlechtsunabhängig. Erhöht bei Zellzerfall (Leber, Blut, Muskel)."
  Cholinesterase: "Von der Leber produziert. Männer-Norm: 5300–12900 U/L. Erniedrigt bei schweren Leberschäden."
  # Niere
  Kreatinin: "Abbauprodukt der Muskeln. Männer-Norm höher (0.7–1.2) wegen mehr Muskelmasse. Bei Alter 70 und Training kann 1.1–1.2 noch normal sein."
  GFR: "Glomeruläre Filtrationsrate. Sinkt natürlich ~1 mL/min pro Jahr ab 40. Bei Alter 70 ist GFR 60–80 altersentsprechend, kein Grund zur Panik."
  Harnstoff: "Eiweißabbauprodukt. Männer tendenziell etwas höher. Steigt bei eiweißreicher Ernährung und Nierenschwäche."
  Harnsäure: "Purinstoffwechsel. Männer-Norm: 3.4–7.0 mg/dL (Frauen niedriger). Gichtrisiko steigt mit Alter und Fleischkonsum."
  # Elektrolyte
  Natrium: "Wichtigstes Elektrolyt. Alters-/geschlechtsunabhängig. Im Alter Risiko für Hyponatriämie (Medikamente, wenig Trinken)."
  Kalium: "Essentiell für Herzrhythmus. Altersunabhängig. Vorsicht bei Nierenschwäche + bestimmten Blutdruckmitteln (ACE-Hemmer)."
  Chlorid: "Elektrolyt – folgt dem Natrium. Alters-/geschlechtsunabhängig."
  Calcium: "Für Knochen und Nerven. Im Alter Vitamin-D-Mangel häufig → Calcium kann sinken. Osteoporose-Vorsorge beachten."
  Magnesium: "Muskel- und Nervenfunktion. Im Alter häufiger Mangel (Medikamente, weniger Aufnahme). Krämpfe als Warnsignal."
  Phosphat: "Baustein für Knochen und Energiestoffwechsel. Altersunabhängig."
  # Stoffwechsel
  Glucose: "Nüchtern-Blutzucker. Diabetesrisiko steigt mit dem Alter. Bei 69 Jahren: unter 100 optimal, 100–125 Prä-Diabetes."
  HbA1c: "Langzeit-Blutzucker (8–12 Wochen). Bei Männern 70+: bis 6.5% wird teils akzeptiert. Unter 5.7% ist optimal."
  HbA1c (IFCC): "Langzeit-Blutzucker in mmol/mol. Normal: 20–42. Bei älteren Patienten bis 48 teils akzeptabel."
  Totalprotein: "Gesamteiweiß. Sinkt leicht im Alter. Niedrig bei Mangelernährung – bei Senioren auf ausreichende Eiweißzufuhr achten."
  # Lipide
  Cholesterin: "Gesamtcholesterin = HDL + LDL + (Triglyceride ÷ 5). Bei Männern 60+ ist <200 das Ziel. Ein hoher Gesamtwert kann durch hohe Triglyceride verursacht werden – dann sind HDL/LDL-Verhältnis und Triglyceride einzeln wichtiger als der Gesamtwert."
  HDL: "Gutes Cholesterin. Männer typisch 40–60 mg/dL (Frauen höher). Sport und ungesättigte Fette erhöhen HDL."
  LDL: "Schlechtes Cholesterin. Bei Männern mit kardiovaskulärem Risiko (Alter 70): Ziel <130, bei Vorerkrankung <100."
  Non-HDL-Cholesterin: "Alles außer HDL. Einfacher Risiko-Marker. Bei Männern 60+ mit Risikofaktoren: Ziel unter 130."
  Triglyceride: "Blutfette. Geschlechtsunabhängig, aber steigen mit Alter, Übergewicht und Alkohol. Nüchtern <150 optimal."
  Quotient Chol/HDL: "Verhältnis Gesamt/HDL. Bei Männern unter 5 gut, unter 3.5 optimal. Steigt mit dem Alter."
  Quotient LDL/HDL: "Verhältnis schlecht/gut. Unter 3 ist Ziel. Bei Männern 60+ besonders wichtig für Gefäßrisiko."
  # Pankreas
  Amylase: "Stärkeverdauungsenzym. Alters-/geschlechtsunabhängig. Erhöht bei Bauchspeicheldrüsenentzündung."
  Pankreas-Amylase: "Pankreas-spezifisch. Genauer als Gesamt-Amylase. Altersunabhängig."
  Lipase: "Fettverdauungsenzym. Alters-/geschlechtsunabhängig. Erhöht = Pankreatitis."
  # Gerinnung
  Quick: "Gerinnungstest. Alters-/geschlechtsunabhängig. Wichtig bei Blutverdünnern. 70–120% normal."
  INR: "Internationaler Gerinnungswert. Bei Marcumar-Therapie: Ziel 2.0–3.0. Altersunabhängig."
  aPTT: "Gerinnungszeit (innerer Weg). Altersunabhängig. Normal: 23–35 Sekunden."
  # Schilddrüse
  TSH: "Schilddrüsen-Steuerhormon. Im Alter leicht höher (bis 4.5 bei 60+). Hoch = Unterfunktion (müde, kalt)."
  T3 Frei: "Freies Trijodthyronin – aktives Schilddrüsenhormon. Reguliert Stoffwechsel und Energieverbrauch."
  T4 Frei: "Freies Thyroxin – Speicherform des Schilddrüsenhormons. Wird bei Bedarf in T3 umgewandelt."
  Calcitonin: "Aus der Schilddrüse – senkt den Calciumspiegel. Tumormarker für medulläres Schilddrüsenkarzinom."
  PTH: "Parathormon – reguliert Calcium und Phosphat. Hoch = Nebenschilddrüsen-Überfunktion oder Vitamin-D-Mangel."
  TG-AK: "Thyreoglobulin-Antikörper – erhöht bei Autoimmunerkrankungen der Schilddrüse (Hashimoto, M. Basedow)."
  TPO-AK: "Thyreoperoxidase-Antikörper – spezifischster Marker für Hashimoto-Thyreoiditis."
  # Tumor-Marker
  PSA: "Prostata-spezifisches Antigen. Nur bei Männern relevant. Altersabhängig: 60–69 Jahre: <4.0 normal. Steigt auch bei gutartiger Vergrößerung."
  # Autoimmun
  Anti-CCP: "Antikörper – sehr spezifisch für rheumatoide Arthritis. Alters-/geschlechtsunabhängig."
  Rheumafaktor: "Unspezifischer Antikörper. Kann im Alter leicht positiv sein ohne Rheuma (bis 14 U/mL normal)."
  Anti-Cardiolipin: "Antikörper gegen Zellmembranen. Altersunabhängig. Erhöht = Thromboserisiko."
  # Eisen
  Eisen: "Für Sauerstofftransport. Männer-Norm: 50–170 µg/dL. Im Alter kann Aufnahme sinken."
  Ferritin: "Eisenspeicher. Männer-Norm: 30–300 ng/mL. Im Alter auf ausreichende Zufuhr achten (rotes Fleisch, Hülsenfrüchte)."
  # Differentialblutbild
  Neutrophile abs.: "Erste Abwehrlinie gegen Bakterien. Alters-/geschlechtsunabhängig. Norm: 1.5–6.7 G/L."
  Neutrophile rel.: "Prozentualer Anteil der Neutrophilen. Norm 40–75%. Altersunabhängig."
  Lymphozyten abs.: "Gezielte Immunabwehr (Viren, Antikörper). Im Alter leicht sinkend (Immunseneszenz)."
  Lymphozyten rel.: "Prozentualer Anteil. Erhöht bei Virusinfekten. Im Alter tendenziell etwas niedriger."
  Monozyten abs.: "Fresszellen. Altersunabhängig. Räumen Zelltrümmer und alternde Zellen auf."
  Monozyten rel.: "Prozentualer Anteil der Monozyten. Norm 2–12%. Geschlechtsunabhängig."
  Eosinophile abs.: "Erhöht bei Allergien und Parasitenbefall. Alters-/geschlechtsunabhängig."
  Eosinophile rel.: "Prozentualer Anteil. Norm 0–7%. Saisonal erhöht bei Heuschnupfen."
  Basophile abs.: "Seltenste weiße Blutzellen. Rolle bei Allergien. Altersunabhängig."
  Basophile rel.: "Prozentualer Anteil. Norm 0–2%. Geschlechtsunabhängig."
  Granulozyten rel.: "Prozentualer Anteil aller Granulozyten (Neutro + Eos + Baso). Norm 40–75%."
  Granulozyten abs.: "Absolute Anzahl aller Granulozyten. Altersunabhängig."
  Granulozyten: "Granulozyten gesamt (ohne Differenzierung abs./rel.). Hauptgruppe der weißen Blutzellen."
  Neutrophile: "Neutrophile Granulozyten (ohne Differenzierung abs./rel.). Bakterien-Abwehr."
  Eosinophile: "Eosinophile Granulozyten (ohne Differenzierung abs./rel.). Allergie- und Parasiten-Abwehr."
  Lymphozyten: "Lymphozyten (ohne Differenzierung abs./rel.). Gezielte Immunabwehr gegen Viren."
  IG-Absolut: "Unreife Granulozyten absolut. Erhöht bei akuten Infektionen und Sepsis."
  IG-Wert: "Unreife Granulozyten relativ (%). Frühmarker für bakterielle Infektionen."
  La-Screen: "Lupus-Antikoagulans Suchtest. Prüft Risiko für Antiphospholipid-Syndrom."
  La-Confirm: "Lupus-Antikoagulans Bestätigungstest. Sichert die Diagnose nach positivem Screening."
  NRBC: "Normoblasten (kernhaltige rote Blutzellen). Erhöht bei schwerer Blutarmut oder Knochenmarkstress."
  NRBC-A: "Normoblasten absolut. Kernhaltige Erythrozyten-Vorstufen im Blut."
  # Körperdaten
  Gewicht: "Körpergewicht. BMI-Ziel bei Männern 65+: 22–27 (etwas höher als bei Jüngeren, da leichtes Übergewicht im Alter schützend wirkt)."
  BMI: "Body-Mass-Index. Für Männer 65+: 22–27 optimal (nicht zu dünn!). Unter 22 = Sarkopenie-Risiko."
  Fettgehalt: "Körperfettanteil. Männer 60+: 13–25% ist akzeptabel. Unter 10% bei Senioren eher kritisch."
  Fett: "Absolute Fettmasse in kg. Sollte nicht zu niedrig sein im Alter (Energiereserve)."
  Muskelmasse: "Muskelmasse sinkt ab 50 um ~1–2% pro Jahr (Sarkopenie). Krafttraining ist die beste Gegenmaßnahme – auch mit 69."
  Körperwasser: "Anteil Wasser. Sinkt im Alter (weniger Muskeln, weniger Durst). 55–65% optimal. Ausreichend trinken!"
  Viszeralfett: "Bauchfett um die Organe. Level 1–12 normal, ab 13 erhöhtes Herz-Kreislauf-Risiko. Steigt mit dem Alter."
  Fettfreie Masse: "Muskeln + Knochen + Organe + Wasser. Im Alter sinkend. Krafttraining und Eiweiß bremsen den Abbau."
  Proteinanteil: "Eiweißanteil im Körper. Bei Männern 60+: 1.0–1.2g Eiweiß/kg/Tag empfohlen um Muskeln zu erhalten."
  Knochenmasse: "Knochengewicht. Bei Männern stabiler als bei Frauen, aber ab 70 steigt Osteoporose-Risiko. Vitamin D + Calcium beachten."
  Testosteron: "Männliches Sexualhormon. Sinkt ab 40 um ~1%/Jahr. Bei 69: 2.5–8.0 ng/mL normal. Symptome: Müdigkeit, weniger Muskeln."
  Myoglobin: "Muskelprotein. Altersunabhängig. Erhöht nach intensivem Sport, Sturz oder Herzinfarkt."
  # Gerinnung/Sonstige
  Senkung: "Blutsenkung. Männer 60+: bis 20mm/h normal (steigt mit dem Alter). Unspezifisch aber bewährt."
  Hyaline Zylinder: "Eiweißausgüsse in den Nieren. Altersunabhängig. Wenige normal, viele = Nierenstress."
  Schleim: "Schleim im Urin. Altersunabhängig. Leicht erhöht meist harmlos (Probenverunreinigung)."
  Plattenepithel.: "Epithelzellen im Urin. Zeigen ob Probe sauber gewonnen wurde. Altersunabhängig."
  Spez. Gewicht: "Urin-Konzentration. Im Alter oft verdünnter (Niere konzentriert schlechter). 1015–1025 normal."
  pH-Wert: "Säuregrad des Urins. Altersunabhängig. 5–8 normal, beeinflusst durch Ernährung."
  Peroxide: "Oxidativer Stress. Steigt mit dem Alter. Antioxidantien (Gemüse, Beeren) können helfen."
  Antioxid Kap.: "Antioxidative Kapazität. Im Alter oft reduziert. Vielfältige Ernährung unterstützt die Abwehr."


