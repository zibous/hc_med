# Verknüpfte Laborwerte – werden als Multi-Chart angezeigt
verknuepfungen:
  - name: "Nierenfunktion"
    beschreibung: "GFR wird aus Kreatinin berechnet. Sinkt die GFR, steigen Kreatinin und Harnstoff."
    tests: ["GFR", "Kreatinin", "Harnstoff"]
  - name: "Blutbild-Trias"
    beschreibung: "Erythrozyten, Hämoglobin und Hämatokrit bewegen sich immer parallel – sinken alle bei Blutarmut."
    tests: ["Erythrozyten", "Hämoglobin", "Hämatokrit"]
  - name: "Lipid-Profil"
    beschreibung: "HDL (gut) und LDL (schlecht) ergeben zusammen das Gesamt-Cholesterin. Triglyceride kommen aus der Nahrung."
    tests: ["Cholesterin", "HDL", "LDL", "Triglyceride"]
  - name: "Eisenstoffwechsel"
    beschreibung: "Ferritin zeigt den Speicher, Eisen den aktuellen Wert. Mangel führt zu niedrigem Hämoglobin."
    tests: ["Eisen", "Ferritin", "Hämoglobin"]
  - name: "Leber-Enzyme"
    beschreibung: "GOT+GPT zeigen Zellschäden, GGT reagiert auf Galle und Alkohol, Bilirubin zeigt den Abbau."
    tests: ["GOT", "GPT", "GGT", "Bilirubin"]
  - name: "Entzündungs-Kaskade"
    beschreibung: "IL-6 steigt zuerst (Stunden), dann CRP (1-2 Tage), Leukozyten reagieren parallel."
    tests: ["CRP", "Leukozyten", "Interleukin-6"]
  - name: "Diabetes-Monitoring"
    beschreibung: "Glucose zeigt den Moment, HbA1c den Durchschnitt der letzten 8-12 Wochen."
    tests: ["Glucose", "HbA1c"]
  - name: "Gerinnung"
    beschreibung: "Quick und INR messen das Gleiche (Quick steigt = INR sinkt). aPTT testet einen anderen Weg."
    tests: ["Quick", "INR", "aPTT"]
