# Tests die nüchtern gemessen werden sollten
# Bei diesen wird ein Hinweis angezeigt wenn der Befund "nüchtern: nein" hat
nuechtern_sensitiv:
  - Triglyceride
  - Glucose
  - Cholesterin
  - Non-HDL-Cholesterin
  - Quotient Chol/HDL
  - Quotient LDL/HDL


# Zusatzbemerkung für den Gesamtbericht
# Wird nach der Gefäßgesundheit-Sektion angezeigt (auch beim Drucken)
# Leer lassen oder entfernen wenn nicht benötigt
gesamtbericht_bemerkung: ""
gesamtbericht_bemerkung1: "KI Auswertung: Patient mit bekannter PAVK/Halsschlagader-Plaques zeigt akuten Entzündungsschub (CRP 3.14, Leukozyten 14.2), Thrombozytenabfall (114) bei Hyperkoagulabilität (Quick >120) und beginnendes Nierenversagen (GFR 66) bei metabolischem Kipppunkt (Triglyceride 473, HbA1c 6.2%)."



# Fallback-Normbereiche wenn im Befund kein Referenzwert steht
# Format: "min-max" oder "<max" oder ">min"
fallback_normbereiche:
  INR: "0.8-1.3"
  HDL: ">40"
  LDL: "<150"
  Non-HDL-Cholesterin: "<160"
  Cholesterin: "<200"
  Triglyceride: "<200"
  Quotient Chol/HDL: "0.0-5.0"
  Quotient LDL/HDL: "0.0-3.0"
  Hämatokrit: "40-54"
