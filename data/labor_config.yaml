# Verknüpfte Laborwerte – werden als Multi-Chart angezeigt
verknuepfungen:
  - name: "Nierenfunktion"
    beschreibung: "GFR wird aus Kreatinin berechnet. Sinkt die GFR, steigen Kreatinin und Harnstoff."
    tests: ["GFR", "Kreatinin", "Harnstoff"]
  - name: "Blutbild-Trias"
    beschreibung: "Erythrozyten, Hämoglobin und Hämatokrit bewegen sich immer parallel – sinken alle bei Blutarmut."
    tests: ["Erythrozyten", "Hämoglobin", "Hämatokrit"]
  - name: "Lipid-Profil"
    beschreibung: "HDL (gut) und LDL (schlecht) ergeben zusammen das Gesamt-Cholesterin. Triglyceride kommen aus der Nahrung."
    tests: ["Cholesterin", "HDL", "LDL", "Triglyceride"]
  - name: "Eisenstoffwechsel"
    beschreibung: "Ferritin zeigt den Speicher, Eisen den aktuellen Wert. Mangel führt zu niedrigem Hämoglobin."
    tests: ["Eisen", "Ferritin", "Hämoglobin"]
  - name: "Leber-Enzyme"
    beschreibung: "GOT+GPT zeigen Zellschäden, GGT reagiert auf Galle und Alkohol, Bilirubin zeigt den Abbau."
    tests: ["GOT", "GPT", "GGT", "Bilirubin"]
  - name: "Entzündungs-Kaskade"
    beschreibung: "IL-6 steigt zuerst (Stunden), dann CRP (1-2 Tage), Leukozyten reagieren parallel."
    tests: ["CRP", "Leukozyten", "Interleukin-6"]
  - name: "Diabetes-Monitoring"
    beschreibung: "Glucose zeigt den Moment, HbA1c den Durchschnitt der letzten 8-12 Wochen."
    tests: ["Glucose", "HbA1c"]
  - name: "Gerinnung"
    beschreibung: "Quick und INR messen das Gleiche (Quick steigt = INR sinkt). aPTT testet einen anderen Weg."
    tests: ["Quick", "INR", "aPTT"]
  - name: "Gewicht & Stoffwechsel"
    beschreibung: "Übergewicht erhöht Blutzucker und Blutfette. Gewichtsverlust verbessert oft alle Werte gleichzeitig."
    tests: ["Gewicht", "BMI", "Glucose", "HbA1c", "Triglyceride"]
  - name: "Bauchfett & Entzündung"
    beschreibung: "Viszeralfett produziert Entzündungsstoffe. Weniger Bauchfett = niedrigeres CRP."
    tests: ["Viszeralfett", "CRP", "Triglyceride"]
  - name: "Muskeln & Nierenwerte"
    beschreibung: "Kreatinin kommt aus den Muskeln – mehr Muskelmasse kann höhere Kreatinin-Werte erklären ohne dass die Niere schwächer ist."
    tests: ["Muskelmasse", "Kreatinin", "GFR"]
  - name: "Körperfett & Blutfette"
    beschreibung: "Weniger Körperfett geht oft mit besserem HDL und niedrigeren Triglyceriden einher."
    tests: ["Fettgehalt", "HDL", "LDL", "Cholesterin"]
  - name: "Cholesterin-Aufschlüsselung"
    beschreibung: "Cholesterin gesamt = HDL + LDL + (Triglyceride ÷ 5). Ein hoher Gesamtwert bei normalem LDL deutet auf hohe Triglyceride als Ursache hin – nicht auf verstopfte Gefäße."
    tests: ["Cholesterin", "HDL", "LDL", "Triglyceride"]


# Test-spezifische Empfehlungen bei auffälligen Werten
# "erhöht" = Flag H, "erniedrigt" = Flag L
# Dynamische Empfehlungen (mit Berechnungen) bleiben im Python-Code
empfehlungen_tests:
  Triglyceride:
    erhöht: "Maßnahmen: 1) Alkohol meiden, 2) Zucker/Weißmehl reduzieren, 3) Omega-3 Fettsäuren (2g/Tag oder fetter Fisch 3×/Woche), 4) Ausdauersport (senkt Triglyceride um 20-30%). Kontrolle in 3 Monaten."
  Leukozyten:
    erhöht: "Dauerhaft erhöht. Mögliche Ursachen: chronische Entzündung, Rauchen, Stress, Medikamente. CRP und Differentialblutbild mit Arzt besprechen."
  GFR:
    erniedrigt: "Bei Alter 70 grenzwertig. Empfehlung: viel trinken (2L/Tag), Blutdruck kontrollieren, Eiweiß nicht übertreiben. Kontrolle alle 6 Monate."
  CRP:
    erhöht: "Falls kein akuter Infekt: chronische Ursachen prüfen (Viszeralfett, Autoimmun, Zähne). Bei KH-Aufenthalt erwartbar erhöht."
  HbA1c:
    erhöht: "Zeigt Prä-Diabetes. Maßnahmen: Zucker/Weißmehl reduzieren, nach Mahlzeiten 15min Spaziergang, Gewicht halten. Kontrolle in 3 Monaten."
  HbA1c (IFCC):
    erhöht: "Zeigt Prä-Diabetes (IFCC-Einheit). Gleichbedeutend mit HbA1c >5.7%. Lebensstil-Maßnahmen können Wert senken."
  Harnsäure:
    erhöht: "Gichtrisiko. Weniger Fleisch/Innereien/Hülsenfrüchte, viel Wasser trinken (2.5L), Alkohol (v.a. Bier) meiden."
  Glucose:
    erhöht: "Nüchternwert erhöht. Mögliche Ursachen: Prä-Diabetes, Stress, Medikamente. HbA1c zur Bestätigung prüfen."
  Hämoglobin:
    erniedrigt: "Blutarmut. Ursachen abklären: Eisenmangel, Blutung, Vitaminmangel (B12/Folsäure), chronische Erkrankung."
  Hämatokrit:
    erniedrigt: "Kann auf Blutarmut oder Überwässerung hindeuten. Zusammen mit Hämoglobin und Erythrozyten bewerten."
  Thrombozyten:
    erniedrigt: "Niedrige Blutplättchen. Bei <100: Blutungsrisiko prüfen. Mögliche Ursachen: Medikamente, Lebererkrankung, Autoimmun."
  Quick:
    erhöht: ">120% ist kein Problem – zeigt schnelle Gerinnung. Nur bei Blutverdünner-Therapie relevant (dann wäre es zu schnell)."
  Kalium:
    erhöht: "Gefährlich für das Herz. Kaliumreiche Lebensmittel reduzieren (Bananen, Nüsse, Trockenfrüchte). Nierenfunktion prüfen."
    erniedrigt: "Kann Herzrhythmusstörungen verursachen. Kaliumreiche Ernährung, Medikamenten-Check (Diuretika?)."
  Natrium:
    erniedrigt: "Hyponatriämie – häufig bei älteren Patienten durch Medikamente oder zu viel Wasser. Trinkmenge und Medikamente prüfen."
  Bilirubin:
    erhöht: "Leicht erhöht ist oft harmlos (Gilbert-Syndrom bei 5-10% der Bevölkerung). Bei Gelbfärbung der Augen: Leber/Galle abklären."
  PSA:
    erhöht: "Erhöhter PSA muss nicht Krebs bedeuten. Auch gutartige Vergrößerung, Entzündung oder Radfahren können PSA erhöhen. Urologe konsultieren."


# Test-spezifische Empfehlungen bei auffälligen Werten
# Werden in der Trend-Ansicht und im Bericht angezeigt
# "dynamisch: true" bedeutet der Code berechnet zusätzlich mit aktuellen Werten
empfehlungen_tests:
  Cholesterin:
    bedingung: "erhöht"
    dynamisch: true
    text: "Gesamt = HDL + LDL + (Triglyceride÷5). Bei hohem Gesamtwert die Einzelwerte anschauen – entscheidend ist was genau erhöht ist (LDL, Triglyceride oder beides). Therapie mit Arzt besprechen."
  Triglyceride:
    bedingung: "erhöht"
    text: "Maßnahmen: 1) Alkohol reduzieren/meiden, 2) Zucker und Weißmehl stark einschränken, 3) Omega-3 Fettsäuren (Fischöl 2g/Tag oder fetter Fisch 3×/Woche), 4) Regelmäßige Bewegung (senkt Triglyceride um 20-30%). Kontrolle in 3 Monaten."
  Leukozyten:
    bedingung: "erhöht"
    text: "Dauerhaft erhöhte Leukozyten ohne akuten Infekt: mögliche Ursachen sind chronische Entzündung, Rauchen, Stress, Medikamente oder hämatologische Erkrankung. CRP und Differentialblutbild mit Arzt besprechen."
  GFR:
    bedingung: "erniedrigt"
    text: "Bei Alter 70 ist leichte GFR-Einschränkung häufig. Maßnahmen: viel trinken (2L/Tag), Blutdruck gut einstellen, Eiweiß nicht übertreiben (0.8-1.0g/kg), nephrotoxische Medikamente meiden. Kontrolle alle 6 Monate."
  CRP:
    bedingung: "erhöht"
    text: "Falls kein akuter Infekt vorliegt: chronische Ursachen prüfen – Viszeralfett, Zahnfleischentzündung, Autoimmunprozesse. Bei Krankenhausaufenthalt ist erhöhtes CRP erwartbar und normalisiert sich meist in 2-4 Wochen."
  HbA1c:
    bedingung: "erhöht"
    text: "Zeigt Prä-Diabetes. Maßnahmen: Zucker und Weißmehl reduzieren, nach jeder Mahlzeit 15min bewegen (Spaziergang), Gewicht halten/reduzieren. Kontrolle in 3 Monaten. Bei >6.5% Diabetes-Diagnose möglich."
  Harnsäure:
    bedingung: "erhöht"
    text: "Gichtrisiko erhöht. Maßnahmen: weniger Fleisch und Innereien, viel Wasser trinken (2.5L/Tag), Alkohol (v.a. Bier) meiden, Kirschen und Vitamin C können helfen. Bei Gichtanfall sofort zum Arzt."
  Hämoglobin:
    bedingung: "erniedrigt"
    text: "Mögliche Blutarmut. Ursachen abklären: Eisenmangel (Ferritin prüfen), B12/Folsäure-Mangel, chronische Erkrankung, Blutungsquelle. Bei KH-Aufenthalt oft durch Blutverlust/Verdünnung bedingt."
  Thrombozyten:
    bedingung: "erniedrigt"
    text: "Niedrige Thrombozyten können durch EDTA-Aggregation (Laborfehler), Medikamente, Autoimmun oder Knochenmark bedingt sein. Bei deiner Vorgeschichte Citrat-Röhrchen anfordern für korrekte Messung."
  Quick:
    bedingung: "erhöht"
    text: "Quick >120% ist meist unbedenklich und zeigt eine gute Gerinnung. Nur bei Blutverdünner-Therapie (Marcumar) ist der Wert relevant – dann INR beachten."
  Hämatokrit:
    bedingung: "erniedrigt"
    text: "Niedriger Hämatokrit deutet auf Verdünnung oder Blutarmut. Zusammen mit Hämoglobin und Erythrozyten beurteilen. Bei KH-Aufenthalt häufig durch Infusionen bedingt."
  Kalium:
    bedingung: "erhöht"
    text: "Erhöhtes Kalium kann gefährlich sein (Herzrhythmusstörungen). Häufige Ursachen: Nierenschwäche, ACE-Hemmer/Sartane, kaliumreiche Ernährung. EKG und Nierenwerte kontrollieren."
  Natrium:
    bedingung: "erniedrigt"
    text: "Niedriges Natrium im Alter oft durch Medikamente (Diuretika), zu viel Wasser trinken oder SIADH. Symptome: Schwindel, Verwirrtheit. Trinkmenge und Medikamente mit Arzt prüfen."
